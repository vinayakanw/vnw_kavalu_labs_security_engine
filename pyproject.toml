# Tooling configuration only. Kavalu Security Engine is an application,
# not a PyPI package, so there is deliberately no [project] table.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["reports", "logs"]

[tool.ruff.lint]
# E = pycodestyle errors (includes E501, line length), F = pyflakes
# (undefined names, unused imports and variables), W = whitespace warnings.
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: starts a throw-away HTTP server on 127.0.0.1 (no internet required)",
]
filterwarnings = [
    # The scanner intentionally fetches targets with verify=False (it audits
    # sites with broken TLS), which makes urllib3 warn on every request.
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    # Third-party noise from ReportLab on newer Pythons; not our code.
    "ignore:ast.NameConstant is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["core", "app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
